<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellness Cafe — Order</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>

<div class="qr-app">
  <header class="qr-header">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="img/logo.png" alt="Wellness Cafe"
           style="width:54px;height:54px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff"
           onerror="this.outerHTML='<span style=&quot;font-size:36px&quot;>☕</span>'">
      <div style="flex:1">
        <h1 style="margin:0">Wellness Cafe</h1>
        <small><i>Relax · Reflect · Recharge</i> · Ground Floor, Block 7, FPM, UPSI</small>
      </div>
    </div>
    <div class="qr-table-info" id="tableInfo">📍 Choose your table below to start ordering</div>
  </header>

  <div class="qr-body">
    <div id="tablePicker" class="card" style="margin:14px 0">

      <div style="text-align:center;padding:8px 8px 18px">
        <div style="font-size:34px;margin-bottom:6px">
          🍽️
        </div>

        <h2 style="margin:0 0 6px">
          Where are you seated?
        </h2>

        <p
          class="text-muted"
          style="
            margin:0;
            font-size:13px;
          "
        >
          Select your table to start ordering
        </p>
      </div>

      <div
        id="tableButtons"
        style="
          display:grid;
          grid-template-columns:
            repeat(auto-fit, minmax(130px, 1fr));
          gap:12px;
        "
      >
        <div
          class="text-muted text-center"
          style="grid-column:1/-1"
        >
          Loading tables…
        </div>
      </div>

      <div
        style="
          border-top:1px solid #e5e7eb;
          margin-top:18px;
          padding-top:16px;
          text-align:center;
        "
      >
        <span
          class="text-muted"
          style="font-size:12px"
        >
          Not dining in?
        </span>

        <br>

        <a
          href="#"
          id="takeaway"
          style="
            display:inline-block;
            margin-top:6px;
            color:#10b981;
            font-weight:700;
            text-decoration:none;
          "
        >
          Order for takeaway →
        </a>
      </div>

    </div>

    <div id="menuArea" class="hidden">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:12px;
          margin:14px 0 10px;
          padding:12px 14px;
          background:#fff;
          border:1px solid #e5e7eb;
          border-radius:12px;
        "
      >
        <div>
          <div
            style="
              font-size:11px;
              color:#64748b;
              text-transform:uppercase;
              font-weight:700;
              letter-spacing:.05em;
            "
          >
            Current Order
          </div>

          <div
            id="menuOrderLocation"
            style="
              margin-top:3px;
              font-weight:700;
              font-size:14px;
            "
          >
            —
          </div>
        </div>

        <button
          type="button"
          class="btn sm"
          id="changeTableBtn"
        >
          Change
        </button>
      </div>

      <div class="qr-cat-tabs" id="qrCatTabs"></div>
      <div class="qr-product-list" id="qrProducts"></div>
    </div>

    <!-- Live order status (shown after a customer has placed an order) -->
    <div id="statusView" class="hidden"></div>
  </div>

  <div class="qr-cart-bar hidden" id="qrCartBar">
    <div class="row">
      <div class="cnt" id="qrCartCount">0</div>
      <div class="info">
        <b id="qrCartTotal">RM 0.00</b>
        <small id="qrCartItems">0 items</small>
      </div>
      <button class="btn primary lg" id="qrViewCart">View Cart →</button>
    </div>
  </div>

  <!-- Discreet staff link for cafe staff to find their portal -->
  <!-- <div style="text-align:center;padding:24px 12px;font-size:11px;color:#94a3b8">
    <a href="staff.html" style="color:#94a3b8;text-decoration:none">Staff Portal</a>
  </div>
</div> -->

<div id="modalRoot"></div>
<div class="toast-container" id="toastContainer"></div>

<script>
const BASE_API = '/api/public';
let cafe = { name:'Wellness Cafe', currency:'RM', tax_rate:0.06 };
let categories = [];
let products = [];
let tables = [];
let currentCat = null;
let cart = [];
let tableId = null;
let mode = null; // 'dinein' | 'takeaway'
let loyaltyCustomer = null;
let loyaltyPhone = null;

const $  = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const money = (n) => cafe.currency + ' ' + (+n).toFixed(2);

function toast(msg, type='success') {
  const c = $('#toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + (type==='error'?'error':'');
  t.innerHTML = `<b>${type==='error'?'Error':'OK'}</b>${msg}`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.2s'; }, 2200);
  setTimeout(()=>t.remove(), 2500);
}

async function fetchJson(method, path, body) {
  const opts = { method, headers: { 'Accept':'application/json', 'Content-Type':'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(BASE_API + path, opts);
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch(e){}
  if (!res.ok) { const err = new Error(data?.message || 'Network error'); err.payload = data; throw err; }
  return data;
}

async function loadData() {
  try {
    const menu = await fetchJson('GET', '/menu');
    cafe = menu.cafe || cafe;
    categories = menu.categories;
    products = menu.products;
    currentCat = categories[0]?.id;
    tables = await fetchJson('GET', '/tables');
    renderTables();
  } catch (err) {
    toast('Could not load menu: ' + err.message, 'error');
  }
}

function renderTables() {
  $('#tableButtons').innerHTML =
    tables.map(t => `
      <button
        class="btn"
        data-tableid="${t.id}"
        style="
          min-height:100px;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          gap:5px;
          border-radius:14px;
        "
      >
        <span style="font-size:24px">
          🪑
        </span>

        <strong style="font-size:15px">
          ${t.name}
        </strong>

        <small class="text-muted">
          Up to ${t.capacity} pax
        </small>
      </button>
    `).join('');
  $$('#tableButtons button[data-tableid]').forEach(b =>
    b.addEventListener('click', () => { tableId = +b.dataset.tableid; mode='dinein'; startMenu(); })
  );
}

$('#takeaway').addEventListener('click', e => {
  e.preventDefault();
  tableId = null; mode = 'takeaway';
  startMenu();
});

function startMenu() {
  $('#tablePicker').classList.add('hidden');
  $('#menuArea').classList.remove('hidden');

  const locationText =
    mode === 'dinein'
      ? `Table ${tables.find(t => t.id === tableId)?.name || ''}`
      : 'Takeaway';

  $('#tableInfo').textContent =
    mode === 'dinein'
      ? `📍 Ordering for ${locationText}`
      : '📦 Takeaway order';

  $('#menuOrderLocation').textContent =
    mode === 'dinein'
      ? `📍 ${locationText}`
      : '📦 Takeaway';

  renderCats();
  renderProducts();
}

$('#changeTableBtn')
  ?.addEventListener('click', () => {
    if (cart.length > 0) {
      const confirmed = confirm(
        'Changing table will clear your current cart. Continue?'
      );

      if (!confirmed) {
        return;
      }

      cart = [];
      refreshCartBar();
    }

    tableId = null;
    mode = null;

    $('#menuArea').classList.add('hidden');
    $('#tablePicker').classList.remove('hidden');

    $('#tableInfo').textContent =
      '📍 Choose your table below to start ordering';
  });

function renderCats() {
  $('#qrCatTabs').innerHTML = categories.filter(c => c.id !== 6).map(c =>
    `<button class="qr-cat ${c.id===currentCat?'active':''}" data-id="${c.id}">${c.icon} ${c.name}</button>`
  ).join('');
  $$('#qrCatTabs .qr-cat').forEach(b => b.addEventListener('click', () => {
    currentCat = +b.dataset.id; renderCats(); renderProducts();
  }));
}

function productIsOrderable(product) {
  if (!product.available) {
    return false;
  }

  if (product.product_type !== 'configurable') {
    return true;
  }

  return (product.variants || []).some(
    variant => variant.available
  );
}

function productDisplayPrice(product) {
  if (product.product_type !== 'configurable') {
    return money(product.price);
  }

  const prices = (product.variants || [])
    .filter(variant => variant.available)
    .map(variant => +variant.price);

  if (prices.length === 0) {
    return 'Sold Out';
  }

  return `From ${money(Math.min(...prices))}`;
}

function renderProducts() {
  const prods = products.filter(
    p => p.category_id === currentCat
  );

  $('#qrProducts').innerHTML = prods.map(p => {
    const orderable = productIsOrderable(p);

    const visual = p.image_url
      ? `
        <img
          src="${p.image_url}"
          style="
            width:70px;
            height:70px;
            border-radius:8px;
            object-fit:cover;
          "
        >
      `
      : (p.image || '🍽');

    return `
      <div class="qr-product ${orderable ? '' : 'sold-out'}">
        <div class="img">${visual}</div>

        <div class="name">
          ${p.name}
        </div>

        <div class="price">
          ${productDisplayPrice(p)}
        </div>

        ${
          orderable
            ? `
              <button
                class="add"
                data-id="${p.id}"
              >
                ${
                  p.product_type === 'configurable' ||
                  (p.addons || []).length > 0
                    ? 'Choose →'
                    : '+ Add'
                }
              </button>
            `
            : `
              <button
                class="add"
                disabled
              >
                Sold Out
              </button>
            `
        }
      </div>
    `;
  }).join('');

  $$('#qrProducts .add[data-id]').forEach(button => {
    button.addEventListener('click', () => {
      const product = products.find(
        p => p.id === +button.dataset.id
      );

      if (!product) {
        return;
      }

      if (
        product.product_type === 'configurable' ||
        (product.addons || []).length > 0
      ) {
        openProductModal(product);
        return;
      }

      addConfiguredItemToCart(
        product,
        null,
        []
      );
    });
  });
}

function addConfiguredItemToCart(
  product,
  variant = null,
  addons = []
) {
  const addonIds = addons
    .map(addon => +addon.id)
    .sort((a, b) => a - b);

  const addonTotal = addons.reduce(
    (sum, addon) => sum + +addon.price,
    0
  );

  const basePrice = variant
    ? +variant.price
    : +product.price;

  const price = basePrice + addonTotal;

  const key = [
    product.id,
    variant?.id || 0,
    addonIds.join('-'),
  ].join(':');

  const existing = cart.find(
    item => item.key === key
  );

  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({
      key,

      productId:
        product.id,

      productVariantId:
        variant?.id || null,

      addonIds,

      name:
        product.name,

      variantName:
        variant?.name || null,

      addonNames:
        addons.map(addon => addon.name),

      price,
      qty: 1,
    });
  }

  toast(`Added: ${product.name}`);

  refreshCartBar();
}

function openProductModal(product) {
  const groups =
    product.option_groups || [];

  const variants =
    product.variants || [];

  const addons =
    (product.addons || [])
      .filter(addon => addon.available);

  const selectedValues = {};
  const selectedAddonIds = new Set();

  function selectedVariant() {
    if (product.product_type !== 'configurable') {
      return null;
    }

    const selectedIds = Object.values(
      selectedValues
    )
      .map(Number)
      .sort((a, b) => a - b);

    if (selectedIds.length !== groups.length) {
      return null;
    }

    return variants.find(variant => {
      if (!variant.available) {
        return false;
      }

      const variantIds =
        (variant.option_values || [])
          .map(value => +value.id)
          .sort((a, b) => a - b);

      return (
        variantIds.length === selectedIds.length &&
        variantIds.every(
          (id, index) =>
            id === selectedIds[index]
        )
      );
    }) || null;
  }

  function renderModal() {
    const variant = selectedVariant();

    const selectedAddons = addons.filter(
      addon => selectedAddonIds.has(+addon.id)
    );

    const addonTotal = selectedAddons.reduce(
      (sum, addon) => sum + +addon.price,
      0
    );

    const basePrice =
      product.product_type === 'configurable'
        ? variant
          ? +variant.price
          : null
        : +product.price;

    const finalPrice =
      basePrice === null
        ? null
        : basePrice + addonTotal;

    const optionHtml = groups.map(group => `
      <div class="product-option-group">
        <div class="product-option-title">
          ${group.name}
          ${
            group.required
              ? '<span class="required-mark">*</span>'
              : ''
          }
        </div>

        <div class="product-option-values">
          ${(group.values || []).map(value => `
            <button
              type="button"
              class="
                product-option-btn
                ${
                  selectedValues[group.id] === value.id
                    ? 'selected'
                    : ''
                }
              "
              data-group="${group.id}"
              data-value="${value.id}"
              ${value.available ? '' : 'disabled'}
            >
              ${value.name}
              ${
                value.available
                  ? ''
                  : '<small>Sold Out</small>'
              }
            </button>
          `).join('')}
        </div>
      </div>
    `).join('');

    const addonHtml = addons.length
      ? `
        <div class="product-addon-section">
          <div class="product-option-title">
            ⚡ Boost it Up!
          </div>

          <div class="product-addon-list">
            ${addons.map(addon => `
              <label class="product-addon-row">
                <span>
                  <input
                    type="checkbox"
                    data-addon="${addon.id}"
                    ${
                      selectedAddonIds.has(+addon.id)
                        ? 'checked'
                        : ''
                    }
                  >

                  ${addon.name}
                </span>

                <b>
                  + ${money(addon.price)}
                </b>
              </label>
            `).join('')}
          </div>
        </div>
      `
      : '';

    let selectionMessage = '';

    if (product.product_type === 'configurable') {
      const allSelected =
        Object.keys(selectedValues).length ===
        groups.length;

      if (!allSelected) {
        selectionMessage =
          'Please choose all required options.';
      } else if (!variant) {
        selectionMessage =
          'This combination is currently unavailable.';
      } else {
        selectionMessage =
          variant.name;
      }
    }

    const html = `
      <div class="modal-head">
        <div>
          <h3>${product.name}</h3>

          ${
            product.product_type === 'configurable'
              ? `
                <small class="text-muted">
                  Customize your order
                </small>
              `
              : ''
          }
        </div>

        <button
          class="close-btn"
          id="closeProductModal"
        >
          ×
        </button>
      </div>

      <div class="modal-body product-config-body">
        ${
          optionHtml
        }

        ${
          product.product_type === 'configurable'
            ? `
              <div
                class="
                  product-variant-message
                  ${variant ? 'valid' : ''}
                "
              >
                ${selectionMessage}
              </div>
            `
            : ''
        }

        ${addonHtml}
      </div>

      <div class="modal-foot product-config-foot">
        <div class="product-config-price">
          <small>Total</small>

          <strong>
            ${
              finalPrice === null
                ? 'Select options'
                : money(finalPrice)
            }
          </strong>
        </div>

        <button
          type="button"
          class="btn primary lg"
          id="addConfiguredProduct"
          ${
            product.product_type === 'configurable' &&
            !variant
              ? 'disabled'
              : ''
          }
        >
          Add to Cart
        </button>
      </div>
    `;

    $('#modalRoot').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal product-config-modal">
          ${html}
        </div>
      </div>
    `;

    $('#closeProductModal')
      ?.addEventListener(
        'click',
        () => {
          $('#modalRoot').innerHTML = '';
        }
      );

    $$('#modalRoot .product-option-btn')
      .forEach(button => {
        button.addEventListener(
          'click',
          () => {
            selectedValues[
              +button.dataset.group
            ] = +button.dataset.value;

            renderModal();
          }
        );
      });

    $$(
      '#modalRoot input[data-addon]'
    ).forEach(input => {
      input.addEventListener(
        'change',
        () => {
          const addonId =
            +input.dataset.addon;

          if (input.checked) {
            selectedAddonIds.add(addonId);
          } else {
            selectedAddonIds.delete(addonId);
          }

          renderModal();
        }
      );
    });

    $('#addConfiguredProduct')
      ?.addEventListener(
        'click',
        () => {
          const chosenVariant =
            selectedVariant();

          if (
            product.product_type ===
              'configurable' &&
            !chosenVariant
          ) {
            return;
          }

          const chosenAddons =
            addons.filter(
              addon =>
                selectedAddonIds.has(
                  +addon.id
                )
            );

          addConfiguredItemToCart(
            product,
            chosenVariant,
            chosenAddons
          );

          $('#modalRoot').innerHTML = '';
        }
      );
  }

  renderModal();
}

function refreshCartBar() {
  const cnt = cart.reduce((s,x) => s + x.qty, 0);
  const total = cart.reduce((s,x) => s + x.price * x.qty, 0);
  if (cnt === 0) { $('#qrCartBar').classList.add('hidden'); return; }
  $('#qrCartBar').classList.remove('hidden');
  $('#qrCartCount').textContent = cnt;
  $('#qrCartTotal').textContent = money(total);
  $('#qrCartItems').textContent = `${cnt} ${cnt===1?'item':'items'}`;
}

$('#qrViewCart').addEventListener('click', openCart);

function openCart() {
  const sub =
    cart.reduce(
      (s, x) => s + x.price * x.qty,
      0
    );

  const memberDiscount =
    loyaltyCustomer
      ? sub *
        (
          +loyaltyCustomer.discount_percentage /
          100
        )
      : 0;

  const taxBase =
    Math.max(
      0,
      sub - memberDiscount
    );

  const tax =
    taxBase * cafe.tax_rate;

  const total =
    taxBase + tax;
  const html = `
    <div class="modal-head"><h3>🛒 Your Order</h3><button class="close-btn" onclick="document.getElementById('modalRoot').innerHTML=''">×</button></div>
    <div class="modal-body">
      ${cart.length===0 ? '<div class="empty"><span class="em">🛒</span>Cart is empty</div>' : ''}
      ${cart.map((it,i)=>`
        <div class="cart-item">
          <div class="info">
            <b>${it.name}</b>

            ${
              it.variantName
                ? `
                  <small class="cart-config">
                    ${it.variantName}
                  </small>
                `
                : ''
            }

            ${
              (it.addonNames || []).length
                ? `
                  <small class="cart-config">
                    ${it.addonNames
                      .map(name => `+ ${name}`)
                      .join('<br>')}
                  </small>
                `
                : ''
            }

            <small>
              ${money(it.price)} × ${it.qty}
            </small>
          </div>
        <div class="qty-ctrl">
          <button data-act="dec" data-i="${i}">−</button>
          <span>${it.qty}</span>
          <button data-act="inc" data-i="${i}">+</button>
        </div>
      </div>`).join('')}
      ${cart.length>0?`
      <div class="cart-summary">
        <div class="sum-line">
          <span>Subtotal</span>
          <span>${money(sub)}</span>
        </div>

        ${
          memberDiscount > 0
            ? `
              <div class="sum-line">
                <span>
                  ${loyaltyCustomer.membership}
                  Member Discount
                  (${loyaltyCustomer.discount_percentage}%)
                </span>

                <span>
                  − ${money(memberDiscount)}
                </span>
              </div>
            `
            : ''
        }

        <div class="sum-line">
          <span>
            Tax (${(cafe.tax_rate * 100).toFixed(0)}%)
          </span>
          <span>${money(tax)}</span>
        </div>

        <div class="sum-line total">
          <span>Total</span>
          <span>${money(total)}</span>
        </div>
      </div>

      <div
        style="
          margin-top:16px;
          padding:14px;
          border:1px solid #e5e7eb;
          border-radius:12px;
          background:#f8fafc;
        "
      >
        <div
          style="
            font-weight:700;
            margin-bottom:4px;
          "
        >
          ⭐ Wellness Loyalty
        </div>

        <div
          class="text-muted"
          style="
            font-size:12px;
            margin-bottom:12px;
          "
        >
          Already a member? Find your account to receive
          your loyalty benefits.
        </div>

        ${
          loyaltyCustomer
            ? `
              <div
                style="
                  padding:12px;
                  background:#fff;
                  border:1px solid #d1fae5;
                  border-radius:10px;
                "
              >
                <div
                  style="
                    font-weight:700;
                    font-size:15px;
                  "
                >
                  ✓ ${loyaltyCustomer.name}
                </div>

                <div
                  style="
                    margin-top:4px;
                    font-size:13px;
                  "
                >
                  ${loyaltyCustomer.membership} Member
                </div>

                <div
                  class="text-muted"
                  style="
                    margin-top:5px;
                    font-size:12px;
                  "
                >
                  ${loyaltyCustomer.points} points
                  ·
                  ${money(loyaltyCustomer.total_spent)} spent
                </div>

                ${
                  loyaltyCustomer.discount_percentage > 0
                    ? `
                      <div
                        style="
                          margin-top:7px;
                          font-size:12px;
                          font-weight:700;
                          color:#059669;
                        "
                      >
                        ${loyaltyCustomer.discount_percentage}%
                        member discount
                      </div>
                    `
                    : ''
                }

                <button
                  type="button"
                  class="btn sm"
                  id="qrChangeMember"
                  style="margin-top:10px"
                >
                  Use another account
                </button>
              </div>
            `
            : `
              <div class="field" style="margin-bottom:8px">
                <label>Phone Number</label>

                <input
                  id="qrMemberPhone"
                  type="tel"
                  inputmode="tel"
                  placeholder="e.g. 0123456789"
                >
              </div>

              <button
                type="button"
                class="btn"
                id="qrFindMember"
                style="width:100%"
              >
                Find My Account
              </button>

              <div
                id="qrMemberMessage"
                style="
                  display:none;
                  margin-top:8px;
                  font-size:12px;
                "
              ></div>
            `
        }
      </div>

      <div class="field mt-3">
        <label>Name (optional)</label>
        <input
          id="qrName"
          placeholder="Your name"
          value="${loyaltyCustomer?.name || ''}"
        >
      </div>

      <div class="field">
        <label>Notes for kitchen (optional)</label>
        <input
          id="qrNotes"
          placeholder="e.g. Less sugar"
        >
      </div>
      `:''}
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="document.getElementById('modalRoot').innerHTML=''">Keep Shopping</button>
      ${cart.length>0?`<button class="btn primary lg" id="qrCheckout">Place Order →</button>`:''}
    </div>`;
  $('#modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)this.remove()"><div class="modal">${html}</div></div>`;
  $$('#modalRoot .qty-ctrl button').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i, act = b.dataset.act;
    if (act==='inc') cart[i].qty += 1;
    else if (act==='dec') {
      if (cart[i].qty>1) cart[i].qty -= 1;
      else cart.splice(i,1);
    }
    refreshCartBar();
    openCart();
  }));

  const findMemberBtn = $('#qrFindMember');

  if (findMemberBtn) {
    findMemberBtn.addEventListener(
      'click',
      async () => {
        const phone =
          ($('#qrMemberPhone')?.value || '').trim();

        const message =
          $('#qrMemberMessage');

        if (!phone) {
          message.style.display = 'block';
          message.style.color = '#dc2626';
          message.textContent =
            'Please enter your phone number.';
          return;
        }

        findMemberBtn.disabled = true;
        findMemberBtn.textContent =
          'Searching...';

        try {
          const result = await fetchJson(
            'POST',
            '/customer/lookup',
            { phone }
          );

          if (!result.found) {
            message.style.display = 'block';
            message.style.color = '#dc2626';
            message.textContent =
              result.message ||
              'Customer not found.';

            return;
          }

          loyaltyCustomer =
            result.customer;

          loyaltyPhone = phone;

          openCart();

        } catch (err) {
          message.style.display = 'block';
          message.style.color = '#dc2626';
          message.textContent =
            err.payload?.message ||
            'Unable to find customer.';

        } finally {
          findMemberBtn.disabled = false;
          findMemberBtn.textContent =
            'Find My Account';
        }
      }
    );
  }

  const changeMemberBtn =
    $('#qrChangeMember');

  if (changeMemberBtn) {
    changeMemberBtn.addEventListener(
      'click',
      () => {
        loyaltyCustomer = null;
        loyaltyPhone = null;
        openCart();
      }
    );
  }

  const checkout = $('#qrCheckout');
  if (checkout) checkout.addEventListener('click', placeOrder);
}

async function placeOrder() {
  const customerName = ($('#qrName')?.value || '').trim() || 'QR Customer';
  const notes = ($('#qrNotes')?.value || '').trim();
  try {
    const order = await fetchJson(
      'POST',
      '/orders',
      {
        items: cart.map(c => ({
          product_id:
            c.productId,

          product_variant_id:
            c.productVariantId || null,

          addon_ids:
            c.addonIds || [],

          qty:
            c.qty
        })),

        table_id: tableId,

        customer_name:
          loyaltyCustomer
            ? null
            : customerName,

        loyalty_phone:
          loyaltyPhone,

        notes,
      }
    );
    // Close the cart modal and switch the page to the live status view
    $('#modalRoot').innerHTML = '';
    cart = [];
    loyaltyCustomer = null;
    loyaltyPhone = null;

    refreshCartBar();
    // Persist so a phone reload still shows the customer's order
    try { localStorage.setItem('wc_active_order', order.order_no); } catch(e){}
    showStatusView(order.order_no);
  } catch (err) {
    toast(err.payload?.message || 'Order failed: ' + err.message, 'error');
  }
}

/* ===== Live order status (post-order) ===== */
let statusPollTimer = null;
let lastStage = null;
const STATUS_POLL_MS = 5000;

const STAGES = [
  { key:'waiting_payment', label:'Awaiting payment',icon:'💳', detail:'Please proceed to the cashier counter to make payment.'},
  { key:'preparing',       label:'Preparing',       icon:'👨‍🍳', detail:'The kitchen has received your order.' },
  { key:'ready',           label:'Ready for pickup',icon:'🛎',  detail:'Your order is ready — please collect it.' },
  { key:'completed',       label:'Picked up',       icon:'✅', detail:'Enjoy! Thank you for visiting.' },
];

function stopStatusPoll() {
  if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; }
}

function showStatusView(orderNo) {
  $('#tablePicker').classList.add('hidden');
  $('#menuArea').classList.add('hidden');
  $('#qrCartBar').classList.add('hidden');
  $('#statusView').classList.remove('hidden');
  $('#tableInfo').textContent = `📋 Order ${orderNo}`;
  lastStage = null;
  fetchAndRenderStatus(orderNo);
  stopStatusPoll();
  statusPollTimer = setInterval(() => fetchAndRenderStatus(orderNo), STATUS_POLL_MS);
}

async function fetchAndRenderStatus(orderNo) {
  try {
    const data = await fetchJson('GET', `/orders/${encodeURIComponent(orderNo)}/status`);
    renderStatusView(data);
  } catch (err) {
    if (err.message?.includes('404') || err.payload?.message === 'Order not found') {
      stopStatusPoll();
      try { localStorage.removeItem('wc_active_order'); } catch(e){}
      $('#statusView').innerHTML = `
        <div class="card text-center" style="margin:14px 0;padding:20px">
          <div style="font-size:48px">❓</div>
          <h3>Order not found</h3>
          <p class="text-muted" style="font-size:13px">This order is no longer available.</p>
          <button class="btn primary lg block mt-3" onclick="location.reload()">Start New Order</button>
        </div>`;
    }
    // network blips: leave the previous render visible, retry next tick
  }
}

function renderStatusView(d) {
  const stageIndex = STAGES.findIndex(s => s.key === d.stage);
  const cur = STAGES[stageIndex] || STAGES[1];

  // Buzz + flash the first time the order becomes "ready"
  if (d.stage === 'ready' && lastStage && lastStage !== 'ready') {
    try { if (navigator.vibrate) navigator.vibrate([200, 80, 200, 80, 400]); } catch(e){}
    document.body.style.animation = 'qrFlash 1s ease 3';
    setTimeout(() => document.body.style.animation = '', 3500);
  }
  lastStage = d.stage;

  const stepsHtml = STAGES.map((s, i) => {
    const done = i < stageIndex;
    const active = i === stageIndex;
    const cls = done ? 'done' : active ? 'active' : 'todo';
    return `<div class="status-step ${cls}">
      <div class="dot">${done ? '✓' : (i+1)}</div>
      <div class="lbl"><b>${s.icon} ${s.label}</b></div>
    </div>`;
  }).join('');

  const heroCls = d.stage === 'ready' ? 'hero-ready'
                : d.stage === 'waiting_payment' ? 'hero-pay'
                : d.stage === 'completed' ? 'hero-done'
                : 'hero-cooking';

  const headline = {
    waiting_payment: 'Please pay at the counter',
    preparing:       'Preparing your order…',
    ready:           '🎉 Ready for pickup!',
    completed:       'Order complete',
    refunded:        'Order refunded',
    cancelled:       'Order cancelled',
  }[d.stage] || 'Tracking your order…';

  const itemsHtml = (d.items || []).map(i => `<li><b>${i.qty}×</b> ${i.name}</li>`).join('');

  // Payment instruction — shown while payment is still pending.
  const payCard = d.stage === 'waiting_payment' ? `
    <div class="card pay-card">
      <div class="card-header">
        <h3>💳 Payment Required</h3>
      </div>

      <div class="pay-card-amount">
        <div class="lbl">Amount to Pay</div>
        <div class="val">${money(d.total)}</div>
      </div>

      <div
        style="
          text-align:center;
          padding:18px 12px;
        "
      >
        <div
          style="
            font-size:42px;
            margin-bottom:10px;
          "
        >
          🧾
        </div>

        <h3 style="margin:0 0 8px">
          Please proceed to the cashier
        </h3>

        <p
          class="text-muted"
          style="
            margin:0;
            font-size:13px;
            line-height:1.6;
          "
        >
          Show your order number to the cashier and make payment
          at the counter.
        </p>

        <div
          style="
            margin-top:16px;
            padding:12px;
            background:#f8fafc;
            border-radius:10px;
            font-size:14px;
          "
        >
          Order Number<br>
          <b style="font-size:20px">${d.order_no}</b>
        </div>

        <div
          style="
            margin-top:14px;
            font-size:12px;
            color:#64748b;
          "
        >
          Your order will be confirmed after payment is received.
        </div>
      </div>
    </div>
  ` : '';

  $('#statusView').innerHTML = `
    <div class="status-hero ${heroCls}">
      <div class="status-icon">${cur.icon}</div>
      <h2>${headline}</h2>
      <div class="status-detail">${cur.detail}</div>
      <div class="status-orderno">Order <b>${d.order_no}</b></div>
    </div>

    <div class="status-steps card">
      ${stepsHtml}
    </div>

    ${payCard}

    <div class="card">
      <div class="card-header"><h3>Your Order</h3></div>
      <ul class="status-items">${itemsHtml}</ul>
      <div class="status-summary">
        <span>Total</span>
        <b>${money(d.total)}</b>
      </div>
      ${d.table ? `<div class="text-muted text-center" style="font-size:12px;margin-top:6px">Table ${d.table}</div>` : `<div class="text-muted text-center" style="font-size:12px;margin-top:6px">Takeaway — collect at counter</div>`}
    </div>

    <div class="text-center mt-3" style="padding-bottom:24px">
      <small class="text-muted">This page refreshes automatically every ${STATUS_POLL_MS/1000}s.</small><br>
      <button class="btn mt-3" onclick="startNewOrderFromStatus()">Start New Order</button>
    </div>
  `;
}

function startNewOrderFromStatus() {
  if (!confirm('Start a new order? Your current order will keep going on the kitchen side.')) return;
  try { localStorage.removeItem('wc_active_order'); } catch(e){}
  location.reload();
}

// Resume status view if the customer reloads with an active order
function resumeOrderIfAny() {
  try {
    const orderNo = localStorage.getItem('wc_active_order');
    if (orderNo) { showStatusView(orderNo); return true; }
  } catch(e){}
  return false;
}

if (!resumeOrderIfAny()) loadData();
</script>

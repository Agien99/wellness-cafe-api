<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellness Cafe POS - Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body>

<div class="app-shell">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <img src="img/logo.png" alt="Wellness Cafe"
           style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff"
           onerror="this.outerHTML='<div class=&quot;icon&quot;>☕</div>'">

      <div class="text">
        Wellness Cafe
        <small>Relax · Reflect · Recharge</small>
      </div>

      <!-- Mobile close button -->
      <button
        type="button"
        class="sidebar-close"
        id="sidebarClose"
        aria-label="Close navigation">
        ×
      </button>
    </div>

    <ul class="nav-list" id="navList">
      <!-- nav items populated by JS based on role -->
    </ul>

    <div class="sidebar-footer">
      <div class="user-card" id="userCard"></div>
      <button class="btn-logout" id="logoutBtn">
        ⎋ Sign Out
      </button>
    </div>
  </aside>

  <!-- Mobile sidebar backdrop -->
  <div
    class="sidebar-backdrop"
    id="sidebarBackdrop">
  </div>

  <!-- ===== Main ===== -->
  <main class="main">

    <header class="topbar">

      <!-- Mobile menu button -->
      <button
        type="button"
        class="mobile-menu-btn"
        id="mobileMenuBtn"
        aria-label="Open navigation"
        aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="page-title">
        <h2 id="pageTitle">Dashboard</h2>
        <small id="pageSubtitle">
          Operational overview & live metrics
        </small>
      </div>

      <div class="clock" id="clock"></div>

    </header>

    <section class="content" id="content">
      <!-- view rendered here -->
    </section>

  </main>
</div>

<div
  class="toast-container"
  id="toastContainer">
</div>

<div id="modalRoot"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>
(function () {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  const menuBtn = document.getElementById('mobileMenuBtn');
  const closeBtn = document.getElementById('sidebarClose');
  const navList = document.getElementById('navList');

  const DESKTOP_BREAKPOINT = 900;
  const STORAGE_KEY = 'wellness_sidebar_collapsed';


  /* ==========================================
     DESKTOP / LAPTOP / LANDSCAPE TABLET
     ========================================== */

  function isDesktopMode() {
    return window.innerWidth > DESKTOP_BREAKPOINT;
  }

  function setDesktopCollapsed(collapsed) {
    document.body.classList.toggle(
      'sidebar-collapsed',
      collapsed
    );

    menuBtn.setAttribute(
      'aria-expanded',
      collapsed ? 'false' : 'true'
    );

    localStorage.setItem(
      STORAGE_KEY,
      collapsed ? '1' : '0'
    );
  }

  function restoreDesktopSidebar() {
    if (!isDesktopMode()) {
      document.body.classList.remove(
        'sidebar-collapsed'
      );

      return;
    }

    const collapsed =
      localStorage.getItem(STORAGE_KEY) === '1';

    document.body.classList.toggle(
      'sidebar-collapsed',
      collapsed
    );

    menuBtn.setAttribute(
      'aria-expanded',
      collapsed ? 'false' : 'true'
    );
  }


  /* ==========================================
     PHONE / SMALL TABLET
     ========================================== */

  function openMobileSidebar() {
    sidebar.classList.add('mobile-open');
    backdrop.classList.add('show');

    document.body.classList.add(
      'sidebar-open'
    );

    menuBtn.setAttribute(
      'aria-expanded',
      'true'
    );
  }

  function closeMobileSidebar() {
    sidebar.classList.remove('mobile-open');
    backdrop.classList.remove('show');

    document.body.classList.remove(
      'sidebar-open'
    );

    menuBtn.setAttribute(
      'aria-expanded',
      'false'
    );
  }


  /* ==========================================
     BURGER BUTTON
     ========================================== */

  menuBtn.addEventListener(
    'click',
    function () {

      if (isDesktopMode()) {

        const collapsed =
          document.body.classList.contains(
            'sidebar-collapsed'
          );

        setDesktopCollapsed(!collapsed);

        return;
      }

      if (
        sidebar.classList.contains(
          'mobile-open'
        )
      ) {
        closeMobileSidebar();
      } else {
        openMobileSidebar();
      }
    }
  );


  /* ==========================================
     MOBILE CLOSE BUTTON
     ========================================== */

  closeBtn.addEventListener(
    'click',
    closeMobileSidebar
  );

  backdrop.addEventListener(
    'click',
    closeMobileSidebar
  );


  /* ==========================================
     NAVIGATION
     ========================================== */

  navList.addEventListener(
    'click',
    function (event) {

      if (
        event.target.closest('.nav-link') &&
        !isDesktopMode()
      ) {
        closeMobileSidebar();
      }
    }
  );


  /* ==========================================
     SCREEN RESIZE
     ========================================== */

  window.addEventListener(
    'resize',
    function () {

      if (isDesktopMode()) {

        closeMobileSidebar();
        restoreDesktopSidebar();

      } else {

        document.body.classList.remove(
          'sidebar-collapsed'
        );
      }
    }
  );


  /* ==========================================
     ESCAPE KEY
     ========================================== */

  document.addEventListener(
    'keydown',
    function (event) {

      if (
        event.key === 'Escape' &&
        sidebar.classList.contains(
          'mobile-open'
        )
      ) {
        closeMobileSidebar();
      }
    }
  );


  /* ==========================================
     INITIAL STATE
     ========================================== */

  restoreDesktopSidebar();

})();
</script>

</body>
</html>
